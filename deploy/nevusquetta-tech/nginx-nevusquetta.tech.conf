# nginx untuk nevusquetta.tech — aplikasi PWA NevusQuetta
# Simpan ke /etc/nginx/sites-available/nevusquetta.tech lalu symlink ke
# sites-enabled/. Uji dengan `nginx -t` SEBELUM reload.

server {
    listen 80;
    listen [::]:80;
    server_name nevusquetta.tech www.nevusquetta.tech;

    # Certbot menambahkan blok 443 dan redirect otomatis. Redirect manual di
    # sini hanya jaring pengaman bila certbot belum dijalankan.
    location / {
        return 301 https://nevusquetta.tech$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.nevusquetta.tech;

    ssl_certificate     /etc/letsencrypt/live/nevusquetta.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nevusquetta.tech/privkey.pem;

    # www -> apex: manifest dan scope service worker terikat satu origin.
    return 301 https://nevusquetta.tech$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nevusquetta.tech;

    root /var/www/nevusquetta.tech;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/nevusquetta.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nevusquetta.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    # OCSP stapling: matikan bila server tidak dapat menjangkau CA.
    ssl_stapling on;
    ssl_stapling_verify on;

    # Header keamanan
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;

    # --- Service worker: JANGAN di-cache ------------------------------------
    # Bila berkas ini di-cache browser, pembaruan aplikasi tidak pernah
    # terdeteksi. Ini penyebab paling umum "sudah deploy tapi masih versi lama".
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        types { } default_type application/javascript;
        try_files $uri =404;
    }

    # --- Manifest -----------------------------------------------------------
    location = /manifest.json {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # --- Ikon & aset statis: boleh di-cache lama ----------------------------
    location ~* \.(png|jpg|jpeg|svg|webp|ico|woff2?|css|js)$ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # --- HTML: no-cache agar versi baru cepat terdeteksi --------------------
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # --- Navigasi -----------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Jangan sajikan berkas tersembunyi (mis. .htaccess, .git)
    location ~ /\. {
        deny all;
        return 404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;
    gzip_min_length 512;
}
