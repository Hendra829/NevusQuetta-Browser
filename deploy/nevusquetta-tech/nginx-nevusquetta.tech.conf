# nginx untuk nevusquetta.tech — aplikasi PWA NevusQuetta
# Simpan ke /etc/nginx/sites-available/nevusquetta.tech lalu symlink ke
# sites-enabled/. Uji dengan `nginx -t` SEBELUM reload.
#
# CATATAN KOMPATIBILITAS (jangan dihapus — ini pernah menjadi bug nyata):
#   * HTTP/2 memakai bentuk `listen ... http2`, BUKAN `http2 on;`.
#     `http2 on;` hanya ada di nginx >= 1.25.1. Di nginx 1.22.1 (bawaan
#     Ubuntu 22.04 / Debian 12) direktif itu TIDAK DIKENAL sehingga
#     `nginx -t` GAGAL dan reload akan mematikan situs.
#   * Header keamanan TIDAK boleh ditulis langsung di level `server` saja.
#     Di nginx, begitu sebuah `location` punya `add_header` sendiri, ia
#     BERHENTI mewarisi seluruh `add_header` dari induknya. Karena itu
#     header keamanan dipindah ke snippets/security-headers.conf dan
#     di-`include` di SETIAP location yang memakai add_header.
#   * `default_type` TIDAK cukup untuk manifest.json: mime.types sudah
#     memetakan .json -> application/json, dan default_type hanya dipakai
#     bila tipe tidak dapat ditentukan. Blok `types { }` kosong dipakai
#     lebih dulu untuk mengosongkan peta tipe.

server {
    listen 80;
    listen [::]:80;
    server_name nevusquetta.tech www.nevusquetta.tech;

    # Certbot menambahkan blok 443 dan redirect otomatis. Redirect manual di
    # sini hanya jaring pengaman bila certbot belum dijalankan.
    location / {
        return 301 https://nevusquetta.tech$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.nevusquetta.tech;

    ssl_certificate     /etc/letsencrypt/live/nevusquetta.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nevusquetta.tech/privkey.pem;

    # www -> apex: manifest dan scope service worker terikat satu origin.
    return 301 https://nevusquetta.tech$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nevusquetta.tech;

    # Webroot nginx yang BENAR-BENAR ada di VPS srv1990895.
    # Sebelumnya /var/www/nevusquetta.tech yang TIDAK ada di VPS -> 404.
    root /var/www/html;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/nevusquetta.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nevusquetta.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    # OCSP stapling: matikan bila server tidak dapat menjangkau CA.
    ssl_stapling on;
    ssl_stapling_verify on;

    # Header keamanan di level server (berlaku untuk respons yang tidak
    # melewati location ber-add_header).
    include /etc/nginx/snippets/nevusquetta-security-headers.conf;

    # --- Service worker: JANGAN di-cache ------------------------------------
    # Bila berkas ini di-cache browser, pembaruan aplikasi tidak pernah
    # terdeteksi. Ini penyebab paling umum "sudah deploy tapi masih versi lama".
    location = /service-worker.js {
        include /etc/nginx/snippets/nevusquetta-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        types { } default_type application/javascript;
        try_files $uri =404;
    }

    # --- Manifest -----------------------------------------------------------
    location = /manifest.json {
        include /etc/nginx/snippets/nevusquetta-security-headers.conf;
        # `types { }` mengosongkan peta tipe lebih dulu; tanpa ini mime.types
        # memetakan .json -> application/json dan default_type diabaikan.
        types { } default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # --- Ikon & aset statis: boleh di-cache lama ----------------------------
    location ~* \.(png|jpg|jpeg|svg|webp|ico|woff2?|css|js)$ {
        include /etc/nginx/snippets/nevusquetta-security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # --- HTML: no-cache agar versi baru cepat terdeteksi --------------------
    location ~* \.html$ {
        include /etc/nginx/snippets/nevusquetta-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # --- Navigasi -----------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Jangan sajikan berkas tersembunyi (mis. .htaccess, .git)
    location ~ /\. {
        deny all;
        return 404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;
    gzip_min_length 512;
}
