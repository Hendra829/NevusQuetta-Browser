# Header keamanan NevusQuetta — dipakai bersama oleh nginx-nevusquetta.tech.conf
#
# MENGAPA BERKAS TERPISAH:
# Di nginx, `add_header` TIDAK bersifat menambah terhadap warisan. Begitu
# sebuah `location` mendefinisikan `add_header` sendiri, ia BERHENTI mewarisi
# SELURUH `add_header` dari level `server`. Akibatnya, menaruh header keamanan
# hanya di level `server` membuatnya HILANG pada setiap respons yang cocok
# dengan location ber-add_header (yaitu hampir semua berkas nyata).
#
# Karena itu berkas ini di-`include` di SETIAP location yang memakai
# add_header. Jangan hapus include mana pun.
#
# Pasang ke: /etc/nginx/snippets/nevusquetta-security-headers.conf

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
