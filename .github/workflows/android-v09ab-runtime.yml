name: Android V0.9AB Runtime Matrix

on:
  pull_request:
    paths:
      - "B-Android/**"
      - ".github/workflows/android-v09ab-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-v09ab-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-gate:
    name: runtime-api-${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install compile SDK and native toolchain
        run: |
          sdkmanager_bin="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager_bin" --licenses >/dev/null
          "$sdkmanager_bin" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Run real emulator runtime gate
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 3072M
          disable-animations: true
          disable-spellchecker: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: B-Android
          ndk: 27.2.12479018
          cmake: 3.22.1
          script: bash scripts/runtime_gate.sh "${{ matrix.api }}"

      - name: Print runtime evidence
        if: always()
        run: |
          for f in B-Android/runtime-api-*/results.txt; do
            if [ -f "$f" ]; then
              echo "===== $f ====="
              cat "$f"
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Print fatal diagnostics on failure
        if: failure()
        run: |
          for f in B-Android/runtime-api-*/logcat.txt B-Android/runtime-api-*/exit-info.txt B-Android/runtime-api-*/last-anr.txt; do
            if [ -f "$f" ]; then
              echo "===== $f ====="
              tail -n 300 "$f"
            fi
          done
