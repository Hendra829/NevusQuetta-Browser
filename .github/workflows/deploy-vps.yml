name: Deploy to srv1990895

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build application when a build script exists
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          fi
          if [ -f package.json ] && npm run | grep -qE '^  build'; then
            npm run build
          fi

      - name: Configure SSH
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy files
        shell: bash
        run: |
          if [ -d dist ]; then
            SOURCE_DIR=dist/
          elif [ -d build ]; then
            SOURCE_DIR=build/
          else
            SOURCE_DIR=./
          fi
          rsync -az --delete --exclude='.git' --exclude='.github' "$SOURCE_DIR" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PATH }}/"

      - name: Validate and reload Nginx
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'nginx -t && systemctl reload nginx'
