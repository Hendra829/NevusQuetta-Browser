name: Deploy to srv1990895

# Deploy PWA NevusQuetta ke VPS Hostinger srv1990895 (nevusquetta.tech).
#
# Rahasia di Settings -> Secrets and variables -> Actions:
#   VPS_SSH_KEY  WAJIB  kunci privat Ed25519 (diisi manual oleh pemilik repo)
#   VPS_HOST     WAJIB  srv1990895.hstgr.cloud  (atau 187.53.143.103)
#   VPS_USER     WAJIB  root
#   VPS_PATH     OPSIONAL - default /var/www/html (webroot nginx di VPS ini)
#
# PENTING - KUNCI YANG BENAR-BENAR TERPASANG DI VPS:
#   Kunci publik yang ADA di /root/.ssh/authorized_keys VPS berkomentar
#   `github-actions-nevusquetta`. Kunci `github-actions-deploy-nevusquetta`
#   (fingerprint SHA256:1Sm4ryIjC/Qw4MzYukA+VwLYBnpQcgW/Mul9bjD3KLk) TIDAK
#   terpasang di VPS - JANGAN isi VPS_SSH_KEY dengan kunci privat pasangannya
#   sampai kunci publiknya benar-benar ditambahkan ke VPS.
#   Rincian: deploy/nevusquetta-tech/GITHUB-ACTIONS-SECRETS.md
#
# Kunci privat TIDAK PERNAH ditulis di berkas ini - hanya dibaca dari secrets.*.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-srv1990895
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      # Default /var/www/html - webroot nginx yang benar-benar ada di VPS.
      # Bila rahasia VPS_PATH diisi, nilai itu yang dipakai.
      VPS_PATH: ${{ secrets.VPS_PATH || '/var/www/html' }}
      DOMAIN: nevusquetta.tech
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Periksa rahasia wajib (gagal-tertutup)
        shell: bash
        run: |
          set -euo pipefail
          hilang=0
          for n in VPS_SSH_KEY VPS_HOST VPS_USER; do
            if [ -z "${!n:-}" ]; then
              echo "::error::rahasia $n belum diisi di Settings -> Secrets and variables -> Actions"
              hilang=1
            fi
          done
          if [ "$hilang" -ne 0 ]; then
            echo "::error::deploy DIBATALKAN - rahasia belum lengkap"
            exit 1
          fi
          echo "[v] rahasia wajib tersedia"
          echo "[i] VPS_PATH = $VPS_PATH"

      - name: Siapkan kunci SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts
          echo "[v] kunci SSH disiapkan"

      - name: Uji koneksi SSH
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" 'hostname; id -un'
          echo "[v] koneksi SSH berhasil"

      - name: Cadangkan webroot lama (gagal-tertutup)
        shell: bash
        run: |
          set -euo pipefail
          # /var/www/html adalah webroot default nginx dan mungkin berisi konten
          # lain. rsync memakai --delete, jadi cadangan WAJIB sebelum menimpa.
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" "
            set -e
            P='$VPS_PATH'
            if [ -d \"\$P\" ] && [ -n \"\$(find \"\$P\" -mindepth 1 -maxdepth 1 2>/dev/null)\" ]; then
              U=\$(du -sm \"\$P\" 2>/dev/null | awk '{print \$1}')
              echo \"[i] ukuran webroot lama: \${U} MB\"
              if [ \"\${U:-0}\" -gt 2048 ]; then
                echo '[X] webroot > 2 GB - cadangan dibatalkan demi keamanan'
                echo '[X] set rahasia VPS_PATH ke direktori khusus, mis. /var/www/nevusquetta.tech'
                exit 1
              fi
              B=\"\${P}.bak.\$(date -u +%Y%m%dT%H%M%SZ)\"
              cp -a \"\$P\" \"\$B\"
              echo \"[v] cadangan dibuat: \$B\"
            else
              echo '[i] webroot kosong atau belum ada - tidak ada yang dicadangkan'
            fi
          "
          echo "[v] langkah cadangan selesai"

      - name: Sinkronkan PWA ke VPS
        shell: bash
        run: |
          set -euo pipefail
          SUMBER=deploy/nevusquetta-tech/public_html/
          if [ ! -f "${SUMBER}index.html" ]; then
            echo "::error::sumber PWA tidak ditemukan: ${SUMBER}index.html"
            exit 1
          fi
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" "mkdir -p '$VPS_PATH'"
          rsync -az --delete --chmod=D755,F644 \
            -e "ssh -o BatchMode=yes" \
            "$SUMBER" "$VPS_USER@$VPS_HOST:$VPS_PATH/"
          echo "[v] berkas tersinkron ke $VPS_PATH"

      - name: Validasi konfigurasi nginx (gagal-tertutup)
        shell: bash
        run: |
          set -euo pipefail
          if ! ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'nginx -t'; then
            echo "::error::'nginx -t' GAGAL - nginx TIDAK akan direload"
            exit 1
          fi
          echo "[v] 'nginx -t' LULUS"

      - name: Reload nginx
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'systemctl reload nginx || nginx -s reload'
          echo "[v] nginx direload"

      - name: Verifikasi hasil
        shell: bash
        run: |
          set -euo pipefail
          gagal=0
          for u in / /manifest.json /service-worker.js; do
            kode="$(curl -sS -o /dev/null -w '%{http_code}' -m 25 "https://${DOMAIN}${u}" || echo 000)"
            tipe="$(curl -sS -o /dev/null -w '%{content_type}' -m 25 "https://${DOMAIN}${u}" || echo -)"
            echo "  ${u} -> HTTP=${kode} CT=${tipe}"
            [ "$kode" = "200" ] || gagal=1
          done
          if [ "$gagal" -ne 0 ]; then
            echo "::error::verifikasi gagal - ada URL yang tidak 200"
            exit 1
          fi
          echo "[v] SEMUA VERIFIKASI LULUS"
