name: Build and Quality Check

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate repository basics
        run: |
          test -f README.md
          test -s README.md

      - name: Detect Node.js project
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "has_package_json=true" >> "$GITHUB_OUTPUT"
            if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
              echo "has_npm_lockfile=true" >> "$GITHUB_OUTPUT"
            else
              echo "has_npm_lockfile=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "has_package_json=false" >> "$GITHUB_OUTPUT"
            echo "has_npm_lockfile=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js (with npm cache)
        if: steps.detect.outputs.has_package_json == 'true' && steps.detect.outputs.has_npm_lockfile == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Setup Node.js (without npm cache)
        if: steps.detect.outputs.has_package_json == 'true' && steps.detect.outputs.has_npm_lockfile != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install dependencies (npm ci)
        if: steps.detect.outputs.has_package_json == 'true' && steps.detect.outputs.has_npm_lockfile == 'true'
        run: npm ci

      - name: Install dependencies (npm install)
        if: steps.detect.outputs.has_package_json == 'true' && steps.detect.outputs.has_npm_lockfile != 'true'
        run: npm install

      - name: Run tests
        if: steps.detect.outputs.has_package_json == 'true'
        run: npm test --if-present

      - name: Run build
        if: steps.detect.outputs.has_package_json == 'true'
        run: npm run build --if-present
