name: Build and Quality Check

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate repository basics
        run: |
          test -f README.md
          test -s README.md

      - name: Detect Node.js project
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "has_package_json=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_package_json=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.detect.outputs.has_package_json == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.detect.outputs.has_package_json == 'true'
        run: npm ci

      - name: Run tests
        if: steps.detect.outputs.has_package_json == 'true'
        run: npm test --if-present

      - name: Run build
        if: steps.detect.outputs.has_package_json == 'true'
        run: npm run build --if-present
