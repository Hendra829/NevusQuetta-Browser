name: Package Complete Source Snapshot
# Snapshot packaging workflow.
#
# Diperbaiki: logika pemaketan dipindahkan ke scripts/package_source_snapshot.sh
# yang deterministik + fail-closed + memverifikasi hasilnya sendiri (membuka
# ulang arsip dan mencocokkan hash isi dengan manifest). Lihat AUDIT-REPORT.md.

on:
  push:
    branches: ["package/source-snapshot-20260919"]
    paths:
      - ".github/workflows/package-source-snapshot.yml"
      - "scripts/package_source_snapshot.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-source-snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Di-pin ke commit (bukan tag bergerak) agar supply-chain terkunci.
      - name: Checkout exact snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Build sanitized complete source ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$RUNNER_TEMP/nevusquetta-package/out"
          mkdir -p -- "$out"
          # Script menolak berjalan bila menemukan berkas rahasia/penandatangan,
          # menormalkan mtime ke waktu commit (deterministik), lalu MEMBUKA ULANG
          # arsip dan mencocokkan isinya dengan manifest sebelum menyatakan PASS.
          scripts/package_source_snapshot.sh \
            --repo "$GITHUB_WORKSPACE" \
            --ref "$GITHUB_SHA" \
            --out "$out"

      - name: Independent verification of the produced archive
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$RUNNER_TEMP/nevusquetta-package/out"
          # Gerbang kedua yang berdiri sendiri: hanya membaca arsip + manifest.
          scripts/package_source_snapshot.sh --verify-only \
            --archive "$out/nevusquetta-complete-source.zip" \
            --manifest "$out/SOURCE-FILES.sha256"

      - name: Publish snapshot summary
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$RUNNER_TEMP/nevusquetta-package/out"
          {
            echo "### Complete source snapshot"
            echo ""
            echo "Commit: \`$GITHUB_SHA\`"
            echo ""
            echo '~~~'
            cat "$out/SHA256SUMS.txt"
            echo '~~~'
            echo "Files in archive: $(grep -c '^[0-9a-f]\{64\}  ' "$out/SOURCE-FILES.sha256")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload complete source package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NevusQuetta-Complete-Source-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/nevusquetta-package/out/nevusquetta-complete-source.zip
            ${{ runner.temp }}/nevusquetta-package/out/SHA256SUMS.txt
            ${{ runner.temp }}/nevusquetta-package/out/SOURCE-FILES.sha256
