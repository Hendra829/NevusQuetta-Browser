name: Package NevusQuetta Candidate to VPS

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref/branch/commit to package
        required: true
        default: feat/v09ab-hardening

permissions:
  contents: read

concurrency:
  group: package-nevusquetta-vps-${{ github.event.inputs.source_ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_ref }}
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install Android packages
        run: |
          sdkmanager_bin="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager_bin" --licenses >/dev/null
          "$sdkmanager_bin"             "platforms;android-36"             "build-tools;36.0.0"             "ndk;27.2.12479018"             "cmake;3.22.1"

      - name: Build verified debug candidate
        working-directory: B-Android
        run: |
          ./gradlew --no-daemon clean testDebugUnitTest lintDebug assembleDebug

      - name: Package APK and clean source ZIP
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/source
          cp B-Android/app/build/outputs/apk/debug/app-debug.apk dist/NevusQuetta.apk

          git archive             --format=zip             --output=dist/NevusQuetta-source.zip             HEAD

          (
            cd dist
            sha256sum NevusQuetta.apk NevusQuetta-source.zip > SHA256SUMS.txt
          )

          cat > dist/build-info.txt <<EOF
          repository=${GITHUB_REPOSITORY}
          ref=${GITHUB_REF}
          sha=${GITHUB_SHA}
          run_id=${GITHUB_RUN_ID}
          build_type=debug-candidate
          EOF

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.NEVUS_VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.NEVUS_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts

      - name: Upload candidate to VPS
        env:
          VPS_HOST: ${{ secrets.NEVUS_VPS_HOST }}
          VPS_USER: ${{ secrets.NEVUS_VPS_USER }}
        run: |
          set -euo pipefail
          build_id="${GITHUB_SHA::12}-run-${GITHUB_RUN_ID}"
          remote_tmp="/tmp/nevusquetta-${build_id}"

          ssh "$VPS_USER@$VPS_HOST" "rm -rf '$remote_tmp' && mkdir -p '$remote_tmp'"
          rsync -az --delete dist/ "$VPS_USER@$VPS_HOST:$remote_tmp/"
          ssh "$VPS_USER@$VPS_HOST"             "bash /srv/nevusquetta/tools/deploy-candidate.sh '$build_id' '$remote_tmp' && rm -rf '$remote_tmp'"

          echo "BUILD_ID=$build_id" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate stored on VPS; not promoted to public release." >> "$GITHUB_STEP_SUMMARY"
