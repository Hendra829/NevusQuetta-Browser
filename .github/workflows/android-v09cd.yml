name: Android V0.9CD Gate

on:
  # Gate ini juga harus jalan pada push ke main. Sebelumnya hanya `feat/v09cd`,
  # sehingga PR #11 yang memperbaiki gate ini MASUK ke main tanpa pernah
  # menjalankan gate-nya sendiri di main — regresi akan lolos tanpa terlihat.
  push:
    branches: ["feat/v09cd", "main", "release/**"]
    paths:
      - "B-Android/**"
      - ".github/workflows/android-v09cd.yml"
      - "scripts/package-release.sh"
  pull_request:
    branches: ["feat/v09ab-hardening", "main"]
    paths:
      - "B-Android/**"
      - ".github/workflows/android-v09cd.yml"
      - "scripts/package-release.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-v09cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    defaults:
      run:
        working-directory: B-Android

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android packages
        run: |
          sdkmanager_bin="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_bin"
          yes | "$sdkmanager_bin" --licenses >/dev/null
          "$sdkmanager_bin"             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"             "ndk;27.2.12479018"             "cmake;3.22.1"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "8.11.1"

      - name: Verify no committed secrets or signing material
        run: |
          if git ls-files | grep -E '(\.jks$|\.keystore$|(^|/)\.env($|\.)|secrets\.properties$)'; then
            echo "Sensitive signing/secret material must not be committed" >&2
            exit 1
          fi
          if git grep -nE 'nevuslab122|storePassword[[:space:]]*=[[:space:]]*"|keyPassword[[:space:]]*=[[:space:]]*"' -- .; then
            echo "Hard-coded signing secret found" >&2
            exit 1
          fi

      - name: Clean
        run: ./gradlew --no-daemon clean 2>&1 | tee -a "$RUNNER_TEMP/gradle-gate.log"

      # Lihat catatan di android-v09ab.yml: `if: always()` dipasang supaya
      # kegagalan uji tidak lagi membatalkan Lint/Assemble/checksum dan APK
      # tetap terbentuk. Status job tetap MERAH karena langkah uji yang gagal.
      - name: Unit tests
        id: unit_tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee -a "$RUNNER_TEMP/gradle-gate.log"

      - name: Publish Gradle gate log to job summary
        if: always()
        run: |
          {
            echo "## Gradle gate log (Android V0.9CD Gate)"
            echo ""
            echo '```'
            if [ -s "$RUNNER_TEMP/gradle-gate.log" ]; then
              tail -n 400 "$RUNNER_TEMP/gradle-gate.log"
            else
              echo "(log Gradle tidak terbentuk)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Lint
        if: always()
        run: ./gradlew --no-daemon lintDebug 2>&1 | tee -a "$RUNNER_TEMP/gradle-gate.log"

      - name: Assemble debug APK
        if: always()
        run: ./gradlew --no-daemon assembleDebug 2>&1 | tee -a "$RUNNER_TEMP/gradle-gate.log"

      - name: Verify and print Room schemas
        if: always()
        run: |
          test -s app/schemas/com.nevus.quetta.data.BrowserDatabase/1.json
          test -s app/schemas/com.nevus.quetta.data.BrowserDatabase/2.json
          echo "===== ROOM_SCHEMA_V1 ====="
          cat app/schemas/com.nevus.quetta.data.BrowserDatabase/1.json
          echo "===== ROOM_SCHEMA_V2 ====="
          cat app/schemas/com.nevus.quetta.data.BrowserDatabase/2.json

      - name: Verify exported Room schema is reproducible
        if: always()
        run: |
          git diff --exit-code -- app/schemas/com.nevus.quetta.data.BrowserDatabase/2.json
          echo "ROOM_SCHEMA_V2_REPRODUCIBLE=PASS"

      - name: Record checksum
        if: always()
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app-debug.apk.sha256

      - name: Upload reports APK and schemas
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nevusquetta-v09cd-${{ github.run_number }}
          # fail-closed: APK yang hilang adalah kegagalan gate.
          if-no-files-found: error
          retention-days: 14
          path: |
            B-Android/app/build/outputs/apk/debug/*.apk
            B-Android/app-debug.apk.sha256
            B-Android/app/build/reports/
            B-Android/app/build/test-results/
            B-Android/app/schemas/
