name: Android V0.9CD Gate

on:
  push:
    branches: ["feat/v09cd"]
    paths:
      - "B-Android/**"
      - ".github/workflows/android-v09cd.yml"
      - "scripts/package-release.sh"
  pull_request:
    branches: ["feat/v09ab-hardening", "main"]
    paths:
      - "B-Android/**"
      - ".github/workflows/android-v09cd.yml"
      - "scripts/package-release.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-v09cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    defaults:
      run:
        working-directory: B-Android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android packages
        run: |
          sdkmanager_bin="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_bin"
          yes | "$sdkmanager_bin" --licenses >/dev/null
          "$sdkmanager_bin"             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"             "ndk;27.2.12479018"             "cmake;3.22.1"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify no committed secrets or signing material
        run: |
          if git ls-files | grep -E '(\.jks$|\.keystore$|(^|/)\.env($|\.)|secrets\.properties$)'; then
            echo "Sensitive signing/secret material must not be committed" >&2
            exit 1
          fi
          if git grep -nE 'nevuslab122|storePassword[[:space:]]*=[[:space:]]*"|keyPassword[[:space:]]*=[[:space:]]*"' -- .; then
            echo "Hard-coded signing secret found" >&2
            exit 1
          fi

      - name: Package complete sanitized source snapshot
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$GITHUB_WORKSPACE/source-package"
          STAGE="$RUNNER_TEMP/nevus-source-stage"
          rm -rf "$OUT" "$STAGE"
          mkdir -p "$OUT" "$STAGE"

          git archive --format=tar HEAD | tar -xf - -C "$STAGE"

          find "$STAGE" -type f \(             -iname '*v0.8*.zip' -o             -iname '*v0.8*.tar' -o             -iname '*v0.8*.tar.gz' -o             -iname '*v0.8*.tgz' -o             -iname '*v0.8*.7z'           \) -delete

          find "$STAGE" -depth -type d \(             -name build -o             -name .gradle -o             -name cache -o             -name caches -o             -name node_modules           \) -exec rm -rf {} +

          mapfile -t forbidden < <(
            find "$STAGE" -type f \(               -name '.env' -o -name '.env.*' -o               -name '*.jks' -o -name '*.keystore' -o               -name 'local.properties' -o               -name 'secrets.properties' -o               -name 'credentials.json' -o               -name 'id_rsa' -o -name 'id_ed25519'             \) -print
          )
          if (( ${#forbidden[@]} > 0 )); then
            printf 'Forbidden secret/signing file found: %s\n' "${forbidden[@]}" >&2
            exit 1
          fi

          {
            echo "NevusQuetta complete source snapshot"
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Generated UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Secrets/keystores/cache/build outputs are intentionally excluded."
          } > "$STAGE/SNAPSHOT-INFO.txt"

          (
            cd "$STAGE"
            find . -type f -print | sort > "$OUT/SOURCE-FILES.txt"
            zip -X -q -r "$OUT/NevusQuetta-Complete-Source-2026-09-19.zip" .
          )
          (
            cd "$OUT"
            sha256sum NevusQuetta-Complete-Source-2026-09-19.zip > SOURCE-SHA256SUMS.txt
          )
          unzip -t "$OUT/NevusQuetta-Complete-Source-2026-09-19.zip"

      - name: Clean
        run: ./gradlew --no-daemon clean

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify and print Room schemas
        run: |
          test -s app/schemas/com.nevus.quetta.data.BrowserDatabase/1.json
          test -s app/schemas/com.nevus.quetta.data.BrowserDatabase/2.json
          echo "===== ROOM_SCHEMA_V1 ====="
          cat app/schemas/com.nevus.quetta.data.BrowserDatabase/1.json
          echo "===== ROOM_SCHEMA_V2 ====="
          cat app/schemas/com.nevus.quetta.data.BrowserDatabase/2.json

      - name: Verify exported Room schema is reproducible
        run: |
          git diff --exit-code -- app/schemas/com.nevus.quetta.data.BrowserDatabase/2.json
          echo "ROOM_SCHEMA_V2_REPRODUCIBLE=PASS"

      - name: Record checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app-debug.apk.sha256

      - name: Upload reports APK and schemas
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: nevusquetta-v09cd-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            B-Android/app/build/outputs/apk/debug/app-debug.apk
            B-Android/app-debug.apk.sha256
            B-Android/app/build/reports/
            B-Android/app/build/test-results/
            B-Android/app/schemas/
            source-package/NevusQuetta-Complete-Source-2026-09-19.zip
            source-package/SOURCE-SHA256SUMS.txt
            source-package/SOURCE-FILES.txt
