name: Android V0.9CD Release Gate

on:
  workflow_dispatch:
  push:
    branches:
      - "release/**"

permissions:
  contents: read

concurrency:
  group: android-v09cd-release-${{ github.ref }}
  cancel-in-progress: false

env:
  ANDROID_BUILD_TOOLS: "36.0.0"

jobs:
  release-build:
    name: signed-release-build
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "8.11.1"

      - name: Install Android toolchain
        run: |
          set -euo pipefail
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk" --licenses >/dev/null
          "$sdk"             "platform-tools"             "platforms;android-36"             "build-tools;$ANDROID_BUILD_TOOLS"             "ndk;27.2.12479018"             "cmake;3.22.1"

      - name: Reject committed secrets and garbage
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env($|\.)|local\.properties$|secrets\.properties$)|\.(jks|keystore)$'; then
            echo "Committed release secret/config material found" >&2
            exit 1
          fi
          if git ls-files | grep -E '(^|/)(build|\.gradle|cache|caches)/'; then
            echo "Tracked build/cache garbage found" >&2
            exit 1
          fi
          if git grep -nEI '(storePassword|keyPassword)[[:space:]]*=[[:space:]]*"[^"]+"' -- ':!*.md'; then
            echo "Hard-coded signing password found" >&2
            exit 1
          fi

      - name: Materialize release keystore
        env:
          KEYSTORE_B64: ${{ secrets.NEVUS_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.NEVUS_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEVUS_RELEASE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEVUS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          store="$RUNNER_TEMP/nevus-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$store"
          chmod 0600 "$store"
          test -s "$store"
          echo "NEVUS_RELEASE_STORE=$store" >> "$GITHUB_ENV"
          echo "NEVUS_RELEASE_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NEVUS_RELEASE_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NEVUS_RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Unit lint R8 and signed release
        working-directory: B-Android
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean testDebugUnitTest lintRelease assembleRelease

      - name: Verify release signature alignment and version
        run: |
          set -euo pipefail
          apk="B-Android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/zipalign" -c -v 4 "$apk"
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner" verify             --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/aapt" dump badging "$apk"             | grep -E "versionCode='910'.*versionName='0.9.0-cd-rc1'"

      - name: Package sanitized final candidate
        run: |
          chmod +x scripts/package-release.sh
          scripts/package-release.sh
          (cd dist && sha256sum -c SHA256SUMS.txt)
          {
            echo "### Signed release build"
            echo '~~~'
            cat dist/SHA256SUMS.txt
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

  signed-install:
    name: signed-install-api-${{ matrix.api }}
    needs: release-build
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "8.11.1"

      - name: Install Android toolchain
        run: |
          set -euo pipefail
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk" --licenses >/dev/null
          "$sdk"             "platform-tools"             "platforms;android-36"             "build-tools;$ANDROID_BUILD_TOOLS"             "ndk;27.2.12479018"             "cmake;3.22.1"

      - name: Materialize release keystore
        env:
          KEYSTORE_B64: ${{ secrets.NEVUS_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.NEVUS_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEVUS_RELEASE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEVUS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          store="$RUNNER_TEMP/nevus-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$store"
          chmod 0600 "$store"
          echo "NEVUS_RELEASE_STORE=$store" >> "$GITHUB_ENV"
          echo "NEVUS_RELEASE_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NEVUS_RELEASE_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NEVUS_RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release for runtime gate
        working-directory: B-Android
        run: ./gradlew --no-daemon assembleRelease

      - name: Boot emulator and install signed release
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            apk="B-Android/app/build/outputs/apk/release/app-release.apk"
            "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner" verify --verbose "$apk"
            adb install -r "$apk" | tee "install-release-api-${{ matrix.api }}.txt"
            adb logcat -c
            adb shell am start -W -n com.nevus.quetta/.MainActivity -d https://example.com/               | tee "launch-release-api-${{ matrix.api }}.txt"
            sleep 3
            adb shell dumpsys package com.nevus.quetta               | grep -E 'versionCode=910|versionName=0.9.0-cd-rc1'
            adb logcat -d -v threadtime > "release-logcat-api-${{ matrix.api }}.txt"
            if grep -B4 -A8 'Process: com.nevus.quetta' "release-logcat-api-${{ matrix.api }}.txt"               | grep -q 'FATAL EXCEPTION'; then
              echo "Release crash detected" >&2
              exit 1
            fi
            echo "SIGNED_RELEASE_INSTALL_API_${{ matrix.api }}=PASS"
